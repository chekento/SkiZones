name: 0.42 lift reentry and visual clock QA
on:
  pull_request:
    paths:
      - 'src/core/lift_fleet.gd'
      - 'src/world/resort_view.gd'
      - 'tests/lift_reentry_042.gd'
      - 'tests/lift_frame_pacing_041.gd'
      - '.github/workflows/lift-reentry-042.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lift-reentry-042-${{ github.ref }}
  cancel-in-progress: true
jobs:
  moving-carriers:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      SKIZONES_TOOLS_DIR: /home/runner/skizones-godot
      XDG_DATA_HOME: /home/runner/skizones-godot/share
      GODOT_BIN: /home/runner/skizones-godot/Godot_v4.5.2-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: godot-cache
        with:
          path: /home/runner/skizones-godot
          key: godot-4.5.2-linux-android-source-v2
      - name: Install pinned Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: bash tools/install_godot.sh
      - name: Import Godot resources
        run: '"$GODOT_BIN" --headless --editor --import --quit'
      - name: Numerical 8x to 1x and forced visual clock resync
        run: python3 tools/run_godot_test.py --strict-engine-errors --timeout 180 -- "$GODOT_BIN" --headless --audio-driver Dummy --script tests/lift_frame_pacing_041.gd
      - name: Prepare real 3D rendering
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Actual offscreen multi-mesh carriages and visible camera reentry
        run: xvfb-run -a -s '-screen 0 1440x900x24' python3 tools/run_godot_test.py --strict-engine-errors --timeout 240 -- "$GODOT_BIN" --language de --audio-driver Dummy --resolution 1440x900 --script tests/lift_reentry_042.gd
