name: 0.43 overnight dawn and save retention
on:
  pull_request:
    paths:
      - 'src/main.gd'
      - 'src/core/day_rhythm.gd'
      - 'src/core/resort.gd'
      - 'tests/patch_0423.gd'
      - 'tests/night_fast_forward_043.gd'
      - '.github/workflows/night-dawn-043.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: skizones-043-night-${{ github.ref }}
  cancel-in-progress: true
jobs:
  overnight-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      SKIZONES_TOOLS_DIR: /home/runner/skizones-godot
      XDG_DATA_HOME: /home/runner/skizones-godot/share
      GODOT_BIN: /home/runner/skizones-godot/Godot_v4.5.2-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: godot-cache
        with:
          path: /home/runner/skizones-godot
          key: godot-4.5.2-linux-android-source-v2
      - name: Install pinned Godot runtime
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: bash tools/install_godot.sh
      - name: Verify GDScript import and translations
        run: |
          "$GODOT_BIN" --headless --editor --import --quit
          python3 tools/check_localization.py
      - name: Night clock 19:00 -> 06:50 on 1x, 4x and 8x
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/skizones-test-night-043
        run: python3 tools/run_godot_test.py --strict-engine-errors --timeout 380 -- "$GODOT_BIN" --headless --audio-driver Dummy --script tests/night_fast_forward_043.gd
      - name: 0.42.3 rescue, finance, night and staffing compatibility
        run: python3 tools/run_godot_test.py --strict-engine-errors --timeout 240 -- "$GODOT_BIN" --headless --audio-driver Dummy --script tests/patch_0423.gd
      - name: Real overnight lodging, rescue safety and landscape rhythm
        run: python3 tools/run_godot_test.py --strict-engine-errors --timeout 240 -- "$GODOT_BIN" --headless --audio-driver Dummy --script tests/landscape_rhythm.gd
      - name: Arbitrary-day P0 saving is still functional
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/skizones-test-save-night-043
        run: python3 tools/run_godot_test.py --strict-engine-errors --timeout 240 -- "$GODOT_BIN" --headless --audio-driver Dummy --script tests/save_any_day_0425.gd
