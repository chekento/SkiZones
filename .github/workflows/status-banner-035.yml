name: 0.35 unified radio, mission and achievement banner QA
on:
  pull_request:
    paths:
      - 'src/ui/achievement_toast.gd'
      - 'src/ui/hud.gd'
      - 'src/ui/management.gd'
      - 'src/core/operations.gd'
      - 'translations/en.po'
      - 'tests/status_banner_035.gd'
      - '.github/workflows/status-banner-035.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: status-banner-035-${{ github.ref }}
  cancel-in-progress: true
jobs:
  status-events:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      SKIZONES_TOOLS_DIR: /home/runner/skizones-godot
      XDG_DATA_HOME: /home/runner/skizones-godot/share
      GODOT_BIN: /home/runner/skizones-godot/Godot_v4.5.2-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: godot-cache
        with:
          path: /home/runner/skizones-godot
          key: godot-4.5.2-linux-android-source-v2
      - name: Install pinned Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: bash tools/install_godot.sh
      - name: Import complete GDScript project
        run: |
          python3 - <<'PY'
          import os,subprocess
          p=subprocess.run([os.environ["GODOT_BIN"],"--headless","--editor","--import","--quit"],capture_output=True,text=True,timeout=180)
          print(p.stdout+p.stderr)
          raise SystemExit(1 if p.returncode or "SCRIPT ERROR" in p.stdout+p.stderr else 0)
          PY
      - name: Verify bilingual messages and placeholders
        run: python3 tools/check_localization.py
      - name: Unified announcement priority and scenario save compatibility
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/skizones-test-notifications-035
        run: python3 tools/run_godot_test.py --timeout 180 -- "$GODOT_BIN" --language de --headless --script tests/status_banner_035.gd
      - name: Original achievements and mastery regressions
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/skizones-test-achievement-progression-035
        run: python3 tools/run_godot_test.py --timeout 180 -- "$GODOT_BIN" --language de --headless --script tests/achievement_progression.gd
      - name: Original radio synchronized programme tests
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/skizones-test-radio-live-035
        run: python3 tools/run_godot_test.py --timeout 180 -- "$GODOT_BIN" --language de --headless --script tests/radio_live_033.gd
      - name: Prepare visual renderer
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Live radio song notifications and mobile status history
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/skizones-test-status-audio-ui-035
        run: xvfb-run -a -s '-screen 0 1280x800x24' python3 tools/run_godot_test.py --timeout 180 -- "$GODOT_BIN" --language de --audio-driver Dummy --resolution 1280x800 --script tests/status_banner_audio_scene_035.gd
      - name: Render legacy achievement banner regression
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/skizones-test-achievement-scene-035
        run: xvfb-run -a -s '-screen 0 1280x800x24' python3 tools/run_godot_test.py --timeout 180 -- "$GODOT_BIN" --language de --audio-driver Dummy --resolution 1280x800 --script tests/achievement_scene.gd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-notifications-visual-QA
          path: build/qa/achievement-024-raised-hud.png
          retention-days: 60
