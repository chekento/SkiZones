name: Validate and build Android

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'tools/sync_releases.py'
      - '.github/workflows/sync-release-presentation.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      version: ${{ steps.package.outputs.version }}
    env:
      SKIZONES_TOOLS_DIR: /home/runner/skizones-godot
      XDG_DATA_HOME: /home/runner/skizones-godot/share
      GODOT_BIN: /home/runner/skizones-godot/Godot_v4.5.2-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache pinned Godot and templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/skizones-godot
          key: godot-4.5.2-linux-android-source-v2
      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: bash tools/install_godot.sh
      - name: Import project
        run: |
          python3 - <<'PYCODE'
          import os, subprocess, sys
          result = subprocess.run([os.environ['GODOT_BIN'], '--headless', '--editor', '--import', '--quit'], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, timeout=180)
          print(result.stdout)
          sys.exit(1 if result.returncode or 'SCRIPT ERROR' in result.stdout or '\nERROR:' in result.stdout else 0)
          PYCODE
      - name: Simulation regression tests
        run: 'python3 tools/run_godot_test.py -- "$GODOT_BIN" --language de --headless --script tests/run.gd'
      - name: Career and multi-winter regression tests
        run: 'python3 tools/run_godot_test.py -- "$GODOT_BIN" --language de --headless --script tests/progression.gd'
      - name: Mountain, snow and map progression tests
        run: 'python3 tools/run_godot_test.py -- "$GODOT_BIN" --language de --headless --script tests/mountain_life.gd'
      - name: Automatic classification and junction routes
        run: |
          python3 tools/run_godot_test.py -- "$GODOT_BIN" --language de --headless --script tests/piste_planning.gd
          python3 tools/run_godot_test.py -- "$GODOT_BIN" --language de --headless --script tests/junctions.gd
      - name: Lift seats, pedestrian areas and migration tests
        run: 'python3 tools/run_godot_test.py -- "$GODOT_BIN" --language de --headless --script tests/lifts_and_plazas.gd'
      - name: Curve geometry, pedestrian safety and weekly balance
        run: 'python3 tools/run_godot_test.py -- "$GODOT_BIN" --language de --headless --script tests/build_comfort.gd'
      - name: Asset remodeling, personal guest moods and preferences
        run: 'python3 tools/run_godot_test.py -- "$GODOT_BIN" --language de --headless --script tests/customization.gd'
      - name: Chronological closing, two-seater restart and route decisions
        run: 'python3 tools/run_godot_test.py -- "$GODOT_BIN" --language de --headless --script tests/day_cycle.gd'
      - name: Connected paths, uphill momentum, hiking and save migration
        run: 'python3 tools/run_godot_test.py -- "$GODOT_BIN" --language de --headless --script tests/paths_and_momentum.gd'
      - name: Winter sports, persistent equipment and 0.9 migration
        run: 'python3 tools/run_godot_test.py -- "$GODOT_BIN" --language de --headless --script tests/winter_sports.gd'
      - name: Full English catalog and need-based service routing
        run: |
          python3 tools/check_localization.py
          python3 tools/run_godot_test.py -- "$GODOT_BIN" --language de --headless --script tests/routes_and_services.gd
          python3 tools/run_godot_test.py -- "$GODOT_BIN" --language de --headless --script tests/piste_surfaces.gd
          python3 tools/run_godot_test.py -- "$GODOT_BIN" --language de --headless --script tests/resort_worlds.gd
      - name: Install virtual display for rendered tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Scene, touch and rendered animation tests
        run: xvfb-run -a -s '-screen 0 1440x900x24' python3 tools/run_godot_test.py -- "$GODOT_BIN" --language de --audio-driver Dummy --resolution 1440x900 --script tests/scene.gd
      - name: Camera, terrain and editable waypoint tests
        run: xvfb-run -a -s '-screen 0 1440x900x24' python3 tools/run_godot_test.py -- "$GODOT_BIN" --language de --audio-driver Dummy --resolution 1440x900 --script tests/planning_scene.gd
      - name: Rendered lift occupants and station plazas
        run: xvfb-run -a -s '-screen 0 1440x900x24' python3 tools/run_godot_test.py -- "$GODOT_BIN" --language de --audio-driver Dummy --resolution 1440x900 --script tests/lift_scene.gd
      - name: Build cancellation, two-finger camera and pen/finger scrolling
        run: xvfb-run -a -s '-screen 0 1440x900x24' python3 tools/run_godot_test.py -- "$GODOT_BIN" --language de --audio-driver Dummy --resolution 1440x900 --script tests/build_input_scene.gd
      - name: Rendered remodeling, profiles and bounded visual updates
        run: xvfb-run -a -s '-screen 0 1440x900x24' python3 tools/run_godot_test.py -- "$GODOT_BIN" --language de --audio-driver Dummy --resolution 1440x900 --script tests/customization_scene.gd
      - name: Scrollable day report at phone and tablet sizes
        run: xvfb-run -a -s '-screen 0 1536x864x24' python3 tools/run_godot_test.py -- "$GODOT_BIN" --language de --audio-driver Dummy --resolution 1536x710 --script tests/day_report_scene.gd
      - name: Real path editor and rendered hiking on Sonnenhang
        run: xvfb-run -a -s '-screen 0 1536x864x24' python3 tools/run_godot_test.py -- "$GODOT_BIN" --language de --audio-driver Dummy --resolution 1536x710 --script tests/paths_scene.gd
      - name: Two-finger rotation, visible sports and application recovery
        run: timeout 150 xvfb-run -a -s '-screen 0 1536x864x24' python3 tools/run_godot_test.py -- "$GODOT_BIN" --language de --audio-driver Dummy --resolution 1536x710 --script tests/lifecycle_scene.gd
      - name: Cute winter scenery, opaque guest materials and bounded batches
        run: timeout 150 xvfb-run -a -s '-screen 0 1536x900x24' python3 tools/run_godot_test.py -- "$GODOT_BIN" --language de --audio-driver Dummy --resolution 1536x864 --script tests/cute_scene.gd
      - name: Complete English and German interface with live language switching
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/skizones-test-localization
        run: xvfb-run -a -s '-screen 0 1536x900x24' python3 tools/run_godot_test.py -- "$GODOT_BIN" --language en --audio-driver Dummy --resolution 1536x864 --script tests/localization_scene.gd
      - name: Actual surface picking, construction widths and clear piste geometry
        run: xvfb-run -a -s '-screen 0 1536x900x24' python3 tools/run_godot_test.py -- "$GODOT_BIN" --language de --audio-driver Dummy --resolution 1536x864 --script tests/piste_surfaces_scene.gd
      - name: Eight landscapes, village promenade and real entrance controls
        run: xvfb-run -a -s '-screen 0 1536x900x24' python3 tools/run_godot_test.py -- "$GODOT_BIN" --language de --audio-driver Dummy --resolution 1536x864 --script tests/resort_worlds_scene.gd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SkiZones-visual-QA
          path: build/qa/*
          if-no-files-found: ignore
      - name: CPU stress benchmark at normal and fourfold speed
        run: '"$GODOT_BIN" --headless --script tools/performance_benchmark.gd'
      - name: Independent region save slots
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/skizones-test-regions
        run: 'python3 tools/run_godot_test.py -- "$GODOT_BIN" --language de --headless --script tests/regions.gd'
      - name: Scene smoke test
        run: '"$GODOT_BIN" --headless -- --smoke-test'
      - name: Install Android SDK components
        run: |
          python3 - <<'PY'
          import os, subprocess
          manager = os.path.join(os.environ['ANDROID_HOME'], 'cmdline-tools/latest/bin/sdkmanager')
          subprocess.run([manager, '--licenses'], input=('y\n' * 100).encode(), check=True)
          subprocess.run([manager, 'platform-tools', 'platforms;android-35', 'platforms;android-36', 'build-tools;35.0.0', 'build-tools;35.0.1'], check=True)
          PY
      - name: Keep debug signing identity between builds
        uses: actions/cache@v4
        with:
          path: build/export-config/skizones-debug.keystore
          key: skizones-ci-debug-keystore-v1
      - name: Cache Android Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: skizones-gradle-4.5.2-sdk36-v2
      - name: Export Android APK
        run: python3 tools/export_android.py
      - name: Verify APK signature and archive
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/android/SkiZones-debug.apk
          unzip -t build/android/SkiZones-debug.apk | tail -1
      - name: Prepare versioned APK download
        id: package
        run: python3 tools/package_android.py
      - uses: actions/upload-artifact@v4
        with:
          name: SkiZones-Android-debug
          path: build/release/*
          if-no-files-found: error
          retention-days: 30

      - name: Export x86-64 Android lifecycle test app
        run: python3 tools/export_android.py --preset 'Android lifecycle test' --output build/android/SkiZones-lifecycle-x86_64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SkiZones-Android-lifecycle
          path: build/android/SkiZones-lifecycle-x86_64.apk
          if-no-files-found: error
          retention-days: 30

  android-lifecycle:
    name: Android ${{ matrix.api }} lifecycle
    needs: godot
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DISPLAY: ':99'
      LIBGL_ALWAYS_SOFTWARE: '1'
    strategy:
      fail-fast: false
      matrix:
        api: [30, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install Pillow
      - uses: actions/download-artifact@v4
        with:
          name: SkiZones-Android-lifecycle
          path: build/lifecycle
      - name: Enable hardware virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare Mesa host graphics for actual Android surfaces
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          Xvfb :99 -screen 0 2048x2048x24 -ac -nolisten tcp > "$RUNNER_TEMP/android-display.log" 2>&1 &
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu host -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 tools/android_resume_smoke.py --apk build/lifecycle/SkiZones-lifecycle-x86_64.apk --output build/android-qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SkiZones-Android-${{ matrix.api }}-resume-QA
          path: build/android-qa/*
          if-no-files-found: ignore
          retention-days: 90

  publish:
    name: Publish APK download
    needs: [godot, android-lifecycle]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SkiZones-Android-debug
          path: build/release
      - name: Publish an immutable preview release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.godot.outputs.version }}
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; its downloads are preserved."
          else
            gh release create "$tag" build/release/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "SkiZones ${VERSION} · Android Preview" \
              --notes-file "docs/releases/${VERSION}.md" \
              --prerelease --latest=false
          fi
