        uses: actions/cache@v4
        with:
          path: build/export-config/skizones-debug.keystore
          key: skizones-ci-debug-keystore-v1
      - name: Cache Android Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: skizones-gradle-4.5.2-sdk36-v2
      - name: Export Android APK
        run: python3 tools/export_android.py
      - name: Verify APK signature and archive
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/android/SkiZones.apk
          unzip -t build/android/SkiZones.apk | tail -1
      - name: Verify minimal permissions and retired installer removal
        run: python3 tools/verify_apk_security.py build/android/SkiZones.apk
      - name: Verify update signing continuity with the public APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/verify_update_signing.py
      - name: Prepare versioned APK download
        id: package
        run: python3 tools/package_android.py
      - uses: actions/upload-artifact@v4
        with:
          name: SkiZones-Android-release
          path: build/release/*
          if-no-files-found: error
          retention-days: 30

      - name: Export x86-64 Android lifecycle test app
        run: python3 tools/export_android.py --preset 'Android lifecycle test' --output build/android/SkiZones-lifecycle-x86_64.apk
      - name: Export signed in-place update fixture
        run: |
          # The test update must be newer than the installed Android build.
          latest_code="$(grep '^version/code=' export_presets.cfg | cut -d= -f2 | sort -n | tail -1)"
          next_code="$((latest_code + 1))"
          python3 tools/export_android.py --preset 'Android lifecycle test' --version-code "$next_code" --output build/android/SkiZones-update-x86_64.apk
      - name: Prepare incompatible-signature rejection fixture
        run: |
          "$JAVA_HOME/bin/keytool" -genkeypair -noprompt -keystore build/android/wrong-signer-test.keystore -alias fixture -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 7 -dname 'CN=SkiZones Rejection Test'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks build/android/wrong-signer-test.keystore --ks-key-alias fixture --ks-pass pass:android --key-pass pass:android --out build/android/SkiZones-wrong-signer-x86_64.apk build/android/SkiZones-update-x86_64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SkiZones-Android-lifecycle
          path: |
            build/android/SkiZones-lifecycle-x86_64.apk
            build/android/SkiZones-update-x86_64.apk
            build/android/SkiZones-wrong-signer-x86_64.apk
          if-no-files-found: error
          retention-days: 30

  android-lifecycle:
    name: Android ${{ matrix.api }} lifecycle
    needs: godot
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DISPLAY: ':99'
      LIBGL_ALWAYS_SOFTWARE: '1'
    strategy:
      fail-fast: false
      matrix:
        api: [30, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install Pillow
      - uses: actions/download-artifact@v4
        with:
          name: SkiZones-Android-lifecycle
          path: build/lifecycle
      - name: Enable hardware virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare Mesa host graphics for actual Android surfaces
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          Xvfb :99 -screen 0 2048x2048x24 -ac -nolisten tcp > "$RUNNER_TEMP/android-display.log" 2>&1 &
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          # Godot uses GLES; avoid the unsupported Vulkan/browser path on CI hosts.
          # https://developer.android.com/studio/run/emulator-troubleshooting
          # The API 30 SwiftShader run 41856228949 displayed only the clear
          # colour: its GLES linker reported GL_MAX_FRAGMENT_UNIFORM_VECTORS
          # and hundreds of program errors. Use the same host GLES backend
          # that rendered real gameplay on API 36; never relax pixel checks.
          # Re-test all lifecycle and save-preservation gates before release.
          emulator-options: '-no-window -gpu host -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none'
          script: python3 tools/android_resume_smoke.py --apk build/lifecycle/SkiZones-lifecycle-x86_64.apk --update-apk build/lifecycle/SkiZones-update-x86_64.apk --wrong-signer-apk build/lifecycle/SkiZones-wrong-signer-x86_64.apk --output build/android-qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SkiZones-Android-${{ matrix.api }}-resume-QA
          path: build/android-qa/*
          if-no-files-found: ignore
          retention-days: 90

  publish:
    name: Publish APK download
    needs: [godot, android-lifecycle, career-recovery, historical-saves]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SkiZones-Android-release
          path: build/release
      - name: Confirm this is still the current application source
        id: current
        run: |
          git fetch --depth=1 origin main
          if git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- src scenes tests tools assets project.godot export_presets.cfg .github/workflows/validate-and-build.yml ':!tools/sync_releases.py'; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer application source is being validated; preserve existing public downloads.'
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish an immutable preview release
        if: steps.current.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.godot.outputs.version }}
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; its downloads are preserved."
          else
            gh release create "$tag" build/release/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "SkiZones ${VERSION} · Android Preview" \
              --notes-file "docs/releases/${VERSION}.md" \
              --prerelease --latest=false
          fi







