name: Validate and build Android

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'SUPPORT.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'docs/**'
      - 'tools/sync_releases.py'
      - '.github/workflows/sync-release-presentation.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skizones-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  career-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SKIZONES_TOOLS_DIR: /home/runner/skizones-godot
      XDG_DATA_HOME: /home/runner/skizones-godot/share
      GODOT_BIN: /home/runner/skizones-godot/Godot_v4.5.2-stable_linux.x86_64
      SKIZONES_LEGACY_FIXTURES: /home/runner/legacy019-careers
    steps:
      - uses: actions/checkout@v4
        with:
          path: current
      - uses: actions/checkout@v4
        with:
          ref: v0.19.0
          path: legacy019
      - uses: actions/checkout@v4
        with:
          ref: v0.27.0
          path: legacy027
      - uses: actions/cache@v4
        id: godot-cache
        with:
          path: /home/runner/skizones-godot
          key: godot-4.5.2-linux-android-source-v2
      - name: Install pinned Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        working-directory: current
        run: bash tools/install_godot.sh
      - name: Import original release
        working-directory: legacy019
        run: '"$GODOT_BIN" --headless --editor --import --quit'
      - name: Generate career saves using original 0.19 code
        working-directory: legacy019
        run: python3 ../current/tools/run_godot_test.py --timeout 300 -- "$GODOT_BIN" --language de --headless --script ../current/tests/generate_019_careers.gd
      - name: Import repaired project
        working-directory: current
        run: '"$GODOT_BIN" --headless --editor --import --quit'
      - name: Restore all eight 0.19 careers with real active guests and threads
        working-directory: current
        run: python3 tools/run_godot_test.py --timeout 420 -- "$GODOT_BIN" --language de --headless --script tests/legacy_career_compat.gd
      - name: Verify bilingual source coverage
        working-directory: current
        run: python3 tools/check_localization.py
      - name: Preserve construction and original files when visitor state is damaged
        working-directory: current
        run: python3 tools/run_godot_test.py --timeout 180 -- "$GODOT_BIN" --language de --headless --script tests/load_recovery.gd
      - uses: actions/checkout@v4
        with:
          ref: v0.1.1
          path: legacy011
      - uses: actions/checkout@v4
        with:
          ref: v0.6.0
          path: legacy060
      - name: Generate and restore actual earliest released saves
        env:
          SKIZONES_EARLY_FIXTURES: /home/runner/skizones-early-fixtures
          XDG_DATA_HOME: /home/runner/skizones-test-early-0351
        run: |
          cd legacy011
          "$GODOT_BIN" --headless --editor --import --quit
          SKIZONES_FIXTURE_RELEASE=0.1.1 python3 ../current/tools/run_godot_test.py --timeout 180 -- "$GODOT_BIN" --language de --headless --script ../current/tests/generate_early_saves_0351.gd
          cd ../legacy060
          "$GODOT_BIN" --headless --editor --import --quit
          SKIZONES_FIXTURE_RELEASE=0.6.0 python3 ../current/tools/run_godot_test.py --timeout 180 -- "$GODOT_BIN" --language de --headless --script ../current/tests/generate_early_saves_0351.gd
          cd ../current
          python3 tools/run_godot_test.py --timeout 240 -- "$GODOT_BIN" --language de --headless --script tests/early_save_compat_0351.gd
      - name: Install virtual display
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Render live detailed loading and restored original career
        working-directory: current
        run: xvfb-run -a -s '-screen 0 1536x864x24' python3 tools/run_godot_test.py --timeout 240 -- "$GODOT_BIN" --language de --audio-driver Dummy --resolution 1536x864 --script tests/loading_scene.gd
      - name: Generate real 0.27 careers and verify all hotfix recovery paths
        env:
          XDG_DATA_HOME: /home/runner/skizones-test-027-recovery
        run: |
          cd legacy027
          "$GODOT_BIN" --headless --editor --import --quit
          SKIZONES_LEGACY_FIXTURES=/home/runner/legacy027-careers python3 ../current/tools/run_godot_test.py --timeout 420 -- "$GODOT_BIN" --language de --headless --script ../current/tests/generate_019_careers.gd
          cd ../current
          SKIZONES_LEGACY_FIXTURES=/home/runner/legacy027-careers python3 tools/run_godot_test.py --timeout 420 -- "$GODOT_BIN" --language de --headless --script tests/legacy_career_compat.gd
          SKIZONES_LEGACY_FIXTURES=/home/runner/legacy027-careers python3 tools/run_godot_test.py --timeout 420 -- "$GODOT_BIN" --language de --headless --script tests/save_hotfix_030.gd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loading-and-recovery-visual-QA
          path: current/build/qa/*
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-019-career-fixtures
          path: /home/runner/legacy019-careers/*.json
          retention-days: 90

  historical-saves:
    name: Original release saves (${{ matrix.partition }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        partition: [0, 1, 2]
    env:
      SKIZONES_TOOLS_DIR: /home/runner/skizones-godot
      GODOT_BIN: /home/runner/skizones-godot/Godot_v4.5.2-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        id: godot-cache
        with:
          path: /home/runner/skizones-godot
          key: godot-4.5.2-linux-android-source-v2
      - name: Install pinned Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: bash tools/install_godot.sh
      - name: Generate and restore all pinned historical releases
        run: python3 tools/check_historical_saves.py --partition ${{ matrix.partition }} --partitions 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-release-save-QA-${{ matrix.partition }}
          path: build/historical-saves/*
          retention-days: 90

  godot:
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    outputs:
      version: ${{ steps.package.outputs.version }}
    env:
      SKIZONES_TOOLS_DIR: /home/runner/skizones-godot
      XDG_DATA_HOME: /home/runner/skizones-godot/share
      GODOT_BIN: /home/runner/skizones-godot/Godot_v4.5.2-stable_linux.x86_64
    steps:
      - name: Cancel superseded main builds before publishing any older APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            for (const status of ['in_progress', 'queued']) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner: context.repo.owner, repo: context.repo.repo,
                workflow_id: 'validate-and-build.yml', branch: 'main', event: 'push', status, per_page: 100
              });
              for (const run of runs) {
                if (run.id < context.runId && run.head_sha !== context.sha) {
                  await github.rest.actions.cancelWorkflowRun({owner: context.repo.owner, repo: context.repo.repo, run_id: run.id});
                  core.info(`Cancelled superseded main build ${run.id}`);
                }
              }
            }
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache pinned Godot and templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/skizones-godot
          key: godot-4.5.2-linux-android-source-v2
      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: bash tools/install_godot.sh
      - name: Import project
        run: |
          python3 - <<'PYCODE'
          import os, subprocess, sys
          result = subprocess.run([os.environ['GODOT_BIN'], '--headless', '--editor', '--import', '--quit'], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, timeout=180)
          print(result.stdout)
          sys.exit(1 if result.returncode or 'SCRIPT ERROR' in result.stdout or '\nERROR:' in result.stdout else 0)
          PYCODE
      - name: Install virtual display for rendered tests
        timeout-minutes: 10
        run: |
          # Bound transient apt/network stalls instead of consuming the entire Android job.
          sudo apt-get update -qq -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install -y -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 xvfb libgl1-mesa-dri
      - name: Complete English and German interface with live language switching
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/skizones-test-localization
        run: xvfb-run -a -s '-screen 0 1536x900x24' python3 tools/run_godot_test.py -- "$GODOT_BIN" --language en --audio-driver Dummy --resolution 1536x864 --script tests/localization_scene.gd
      - name: Original wordmark and operating header on phones and desktop
        run: xvfb-run -a -s '-screen 0 1536x1000x24' python3 tools/run_godot_test.py --timeout 300 -- "$GODOT_BIN" --language de --audio-driver Dummy --resolution 1440x900 --script tests/wordmark_header_scene_032.gd
      - name: Theme architecture and holiday catalogue models
        run: python3 tools/run_godot_test.py --timeout 180 -- "$GODOT_BIN" --language de --headless --script tests/style_asset_festival_032.gd
      - name: Real monochrome, distinct buildings and holiday dressing
        run: xvfb-run -a -s '-screen 0 1536x1000x24' python3 tools/run_godot_test.py --timeout 600 -- "$GODOT_BIN" --language de --audio-driver Dummy --resolution 1440x900 --script tests/style_asset_festival_scene_032.gd
      - name: Cinematic director planning and saved attention
        run: python3 tools/run_godot_test.py --timeout 180 -- "$GODOT_BIN" --language de --headless --script tests/cinematic_director_032.gd
      - name: Exact ground-plane sampling, edges and terrain rebuilds
        run: python3 tools/run_godot_test.py --timeout 60 -- "$GODOT_BIN" --language de --headless --script tests/ground_surface_sampling_032.gd
      - name: Audit actual Braunlage return routes across three skiing abilities
        run: python3 tools/run_godot_test.py --timeout 240 -- "$GODOT_BIN" --language de --headless --script tools/audit_scenario_routes.gd -- --map=braunlage
      - name: Interactive piste map and cinematic camera on real phone layouts
        run: xvfb-run -a -s '-screen 0 1536x1000x24' python3 tools/run_godot_test.py --timeout 300 -- "$GODOT_BIN" --language de --audio-driver Dummy --resolution 1440x900 --script tests/cinematic_piste_map_032.gd
      - name: 0.32 direct compile of career, recruitment and panel dependency graph
        run: python3 tools/run_godot_test.py --timeout 180 -- "$GODOT_BIN" --language de --headless --script tests/compile_sensitive_032.gd
      - name: 0.33 live offline radio clock, real seek, mute and background rejoining
        run: python3 tools/run_godot_test.py --timeout 180 -- "$GODOT_BIN" --language de --headless --audio-driver Dummy --script tests/radio_live_033.gd
      - name: 0.33 immediate radio persistence and completed-building/piste inspector
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/skizones-test-radio-build-033
        run: xvfb-run -a -s '-screen 0 1536x1000x24' python3 tools/run_godot_test.py --timeout 300 -- "$GODOT_BIN" --language de --audio-driver Dummy --resolution 1440x900 --script tests/radio_build_hotfix_scene_033.gd
      - name: 0.33 real touch-driven Tic-Tac-Toe mechanics and board
        run: xvfb-run -a -s '-screen 0 1280x900x24' python3 tools/run_godot_test.py --timeout 120 -- "$GODOT_BIN" --language de --audio-driver Dummy --resolution 720x900 --script tests/tic_tac_toe_033.gd
      - name: 0.33 real phone touches, building pause and Back in German and English
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/skizones-test-arcade-033
        run: xvfb-run -a -s '-screen 0 1280x960x24' python3 tools/run_godot_test.py --timeout 300 -- "$GODOT_BIN" --language de --audio-driver Dummy --resolution 900x900 --script tests/arcade_mobile_scene_033.gd
      - name: 0.34 portrait inspector and build palette never overlap
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/skizones-test-portrait-hud-034
        run: xvfb-run -a -s '-screen 0 1280x960x24' python3 tools/run_godot_test.py --timeout 300 -- "$GODOT_BIN" --language de --audio-driver Dummy --resolution 900x900 --script tests/portrait_hud_034.gd
      - name: 0.33 rare weather, no consecutive storms and stable lift wind safety
        run: python3 tools/run_godot_test.py --timeout 180 -- "$GODOT_BIN" --language de --headless --script tests/weather_distribution_033.gd
      - name: 0.33 five animated weather looks, no overlay and mobile particle budget
        run: xvfb-run -a -s '-screen 0 1280x960x24' python3 tools/run_godot_test.py --timeout 240 -- "$GODOT_BIN" --language de --audio-driver Dummy --resolution 900x900 --script tests/weather_atmosphere_scene_033.gd
      - name: 0.33 quiet-night pedestrian fast-forward and bounded dawn interest
        run: python3 tools/run_godot_test.py --timeout 300 -- "$GODOT_BIN" --language de --headless --script tests/quiet_night_033.gd
      - name: 0.36 real hotel reservations, cleaning and mobile floorplan
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/skizones-test-036-hotel-rooms
        run: |
          python3 tools/run_godot_test.py --timeout 240 -- "$GODOT_BIN" --language de --headless --audio-driver Dummy --script tests/hotel_room_operations_036.gd
          xvfb-run -a -s '-screen 0 1440x900x24' python3 tools/run_godot_test.py --timeout 300 -- "$GODOT_BIN" --language de --audio-driver Dummy --resolution 420x860 --script tests/hotel_room_scene_036.gd
      - name: 0.38 hotel simulator, public WC flow and isolated save manager
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/skizones-test-save-manager-038
        run: |
          for test in hotel_simulator_038 public_wc_038 public_wc_flow_038 save_management_038; do
            python3 tools/run_godot_test.py --timeout 240 -- "$GODOT_BIN" --language de --headless --audio-driver Dummy --script "tests/$test.gd" || exit 1
          done
      - name: 0.38.2 repairable primary, historical geometry and original preservation
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/skizones-test-repair-0382
        run: python3 tools/run_godot_test.py --timeout 180 -- "$GODOT_BIN" --language de --headless --script tests/save_repair_0382.gd
      - name: 0.39 mission backup rescue, legacy scenario paths and save isolation
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/skizones-test-save-library-039
        run: python3 tools/run_godot_test.py --timeout 240 -- "$GODOT_BIN" --language de --headless --script tests/save_library_039.gd
      - name: 0.38.2 readable save actions and focused dialogs on phones
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/skizones-test-readable-0382
        run: xvfb-run -a -s '-screen 0 1536x1000x24' python3 tools/run_godot_test.py --timeout 300 -- "$GODOT_BIN" --language de --audio-driver Dummy --resolution 1536x864 --script tests/readable_controls_0382.gd
      - name: 0.38 building actions, hotel entry, staff and fullscreen mobile careers
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/skizones-test-ui-038
        run: xvfb-run -a -s '-screen 0 1536x1000x24' python3 tools/run_godot_test.py --timeout 330 -- "$GODOT_BIN" --language de --audio-driver Dummy --resolution 1440x900 --script tests/ui_building_career_038.gd
      - name: Integrated 0.35 loans, products, notifications and persistent snow
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/skizones-test-035-release
        run: |
          for test in building_offers_loans_035 credit_contracts_035 retail_sales_035 status_banner_035 footwear_persistence_035 ground_surface_sampling_032 walkway_design_037 snow_paths_geometry_037 snow_path_visibility_040 map_creator_040 custom_map_registry_040 specialist_building_040 rescue_protocol_040; do
            python3 tools/run_godot_test.py --timeout 240 -- "$GODOT_BIN" --language de --headless --audio-driver Dummy --script "tests/$test.gd" || exit 1
          done
      - name: Integrated 0.35 radio hardware and live building interface
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/skizones-test-035-release-ui
        run: |
          for test in radio_hardware_035 status_banner_audio_scene_035 expansion_ui_035 planning_paths_scene_037; do
            xvfb-run -a -s '-screen 0 1536x1000x24' python3 tools/run_godot_test.py --timeout 300 -- "$GODOT_BIN" --language de --audio-driver Dummy --resolution 900x900 --script "tests/$test.gd" || exit 1
          done
      - name: Scene, touch and rendered animation tests
        run: xvfb-run -a -s '-screen 0 1440x900x24' python3 tools/run_godot_test.py -- "$GODOT_BIN" --language de --audio-driver Dummy --resolution 1440x900 --script tests/scene.gd
      - name: Rendered remodeling, profiles and bounded visual updates
        run: xvfb-run -a -s '-screen 0 1440x900x24' python3 tools/run_godot_test.py -- "$GODOT_BIN" --language de --audio-driver Dummy --resolution 1440x900 --script tests/customization_scene.gd
      - name: Eight landscapes, village promenade and real entrance controls
        run: xvfb-run -a -s '-screen 0 1536x900x24' python3 tools/run_godot_test.py -- "$GODOT_BIN" --language de --audio-driver Dummy --resolution 1536x864 --script tests/resort_worlds_scene.gd
      - name: 0.32 screen-size layout of careers and real scenarios
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/skizones-test-layout-032
        run: xvfb-run -a -s '-screen 0 1536x900x24' python3 tools/run_godot_test.py --timeout 240 -- "$GODOT_BIN" --language de --audio-driver Dummy --resolution 1440x900 --script tests/responsive_selectors_032.gd
      - name: Newspaper adverts and poster touch, pause and Android Back integration
        run: xvfb-run -a -s '-screen 0 1536x864x24' python3 tools/run_godot_test.py --timeout 240 -- "$GODOT_BIN" --language de --audio-driver Dummy --resolution 1536x864 --script tests/editorial_scene_031.gd
      - name: Five art directions, terrain geometry stability and persistent display settings
        run: xvfb-run -a -s '-screen 0 1536x900x24' python3 tools/run_godot_test.py --timeout 300 -- "$GODOT_BIN" --language de --audio-driver Dummy --resolution 1536x864 --script tests/visual_styles_scene.gd
      - name: Current radio, hotel context, sector operations and editorial release gates
        run: |
          python3 tools/check_localization.py
          python3 tools/run_godot_test.py --timeout 240 -- "$GODOT_BIN" --language de --headless --audio-driver Dummy --script tests/audio_cc0_library_027.gd
          python3 tools/run_godot_test.py --timeout 240 -- "$GODOT_BIN" --language de --headless --audio-driver Dummy --script tests/audio_crossfade_027.gd
          python3 tools/run_godot_test.py --timeout 240 -- "$GODOT_BIN" --language de --headless --audio-driver Dummy --script tests/radio_context_029.gd
          python3 tools/run_godot_test.py --timeout 240 -- "$GODOT_BIN" --language de --headless --audio-driver Dummy --script tests/radio_duration_inventory_029.gd
          python3 tools/run_godot_test.py --timeout 240 -- "$GODOT_BIN" --language de --headless --audio-driver Dummy --script tests/sector_sim_028.gd
          python3 tools/run_godot_test.py --timeout 240 -- "$GODOT_BIN" --language de --headless --audio-driver Dummy --script tests/editorial_townhall_031.gd
      - name: Verify template compatibility before full-world setup
        run: |
          python3 tools/run_godot_test.py --timeout 180 -- "$GODOT_BIN" --language de --headless --script tests/run.gd
          python3 tools/run_godot_test.py --timeout 180 -- "$GODOT_BIN" --language de --headless --script tests/lifts_and_plazas.gd
      - name: 0.32 curated CC0 radio and nonrepeating playlists
        run: python3 tools/run_godot_test.py --timeout 240 -- "$GODOT_BIN" --language de --headless --audio-driver Dummy --script tests/radio_curation_032.gd
      - name: 0.34 offline radio – eleven new pinned CC0 songs and no SoundCloud
        run: python3 tools/run_godot_test.py --timeout 300 -- "$GODOT_BIN" --language de --headless --audio-driver Dummy --script tests/radio_genres_034.gd
      - name: 0.32 crew and scenario support feasibility
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/skizones-test-staff-032
        run: python3 tools/run_godot_test.py --timeout 300 -- "$GODOT_BIN" --language de --headless --script tests/recruitment_scenarios_032.gd
      - name: 0.32 five wealth tiers compatibility gate
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/skizones-test-economy-032
        run: python3 tools/run_godot_test.py --timeout 180 -- "$GODOT_BIN" --language de --headless --script tests/start_tiers_032.gd
      - name: 0.31 complete main-game save library and lossless recovery regression
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/skizones-test-main-save-library
        run: python3 tools/run_godot_test.py --timeout 240 -- "$GODOT_BIN" --language de --headless --script tests/main_save_library_031.gd
      - name: 0.33.2 real free-build slots and checksum-preserving recovery
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/skizones-test-free-slots-0332
        run: python3 tools/run_godot_test.py --timeout 300 -- "$GODOT_BIN" --language de --headless --script tests/save_rescue_free_slots_0332.gd
      - name: 0.33.2 free-build launch and live save-button color regression
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/skizones-test-free-slots-scene-0332
        run: xvfb-run -a -s '-screen 0 1440x900x24' python3 tools/run_godot_test.py --timeout 300 -- "$GODOT_BIN" --language de --audio-driver Dummy --resolution 1280x800 --script tests/free_slots_scene_0332.gd
      - name: Unlimited free build and actual 240-guest resort regression
        env:
          XDG_DATA_HOME: /home/runner/skizones-test-hotfix-0351
        run: |
          python3 tools/run_godot_test.py --timeout 240 -- "$GODOT_BIN" --language de --headless --script tests/legacy_routes_free_mode_0342.gd
          python3 tools/run_godot_test.py --timeout 240 -- "$GODOT_BIN" --language de --headless --script tests/busy_resort_0351.gd
      - name: Main-mode slope traffic and operating-finance release gates
        run: |
          python3 tools/run_godot_test.py --timeout 180 -- "$GODOT_BIN" --language de --headless --script tests/traffic_and_finances.gd
          python3 tools/run_godot_test.py --timeout 180 -- "$GODOT_BIN" --language de --headless --script tests/ski_traffic.gd
      - name: Install Android SDK components
        run: |
          python3 - <<'PY'
          import os, subprocess
          manager = os.path.join(os.environ['ANDROID_HOME'], 'cmdline-tools/latest/bin/sdkmanager')
          subprocess.run([manager, '--licenses'], input=('y\n' * 100).encode(), check=True)
          subprocess.run([manager, 'platform-tools', 'platforms;android-35', 'platforms;android-36', 'build-tools;35.0.0', 'build-tools;35.0.1'], check=True)
          PY
      - name: Compile reviewed Android surface and touch fixes
        run: |
          python3 - <<'PYCODE'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from prepare_android_surface import prepare
          prepare(Path(os.environ['ANDROID_HOME']), Path(os.environ['JAVA_HOME']))
          PYCODE
      - name: New PMDD branding and full-screen startup smoke test
        run: 'python3 tools/run_godot_test.py -- "$GODOT_BIN" --language de --headless --script tests/branding.gd'
      - name: Simulation regression tests
        run: 'python3 tools/run_godot_test.py -- "$GODOT_BIN" --language de --headless --script tests/run.gd'
      - name: Modular piste features, day pacing and sleeping guest regressions
        run: python3 tools/run_godot_test.py --timeout 180 -- "$GODOT_BIN" --language de --headless --script tests/landscape_rhythm.gd
      - name: Combined hotel modules, annual events, spatial audio and scenario media
        run: |
