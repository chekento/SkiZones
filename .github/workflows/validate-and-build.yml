name: Validate and build Android

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'tools/sync_releases.py'
      - '.github/workflows/sync-release-presentation.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      version: ${{ steps.package.outputs.version }}
    env:
      SKIZONES_TOOLS_DIR: /home/runner/skizones-godot
      XDG_DATA_HOME: /home/runner/skizones-godot/share
      GODOT_BIN: /home/runner/skizones-godot/Godot_v4.5.1-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache pinned Godot and templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/skizones-godot
          key: godot-4.5.1-linux-android-v1
      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: bash tools/install_godot.sh
      - name: Import project
        run: |
          python3 - <<'PYCODE'
          import os, subprocess, sys
          result = subprocess.run([os.environ['GODOT_BIN'], '--headless', '--editor', '--import', '--quit'], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, timeout=180)
          print(result.stdout)
          sys.exit(1 if result.returncode or 'SCRIPT ERROR' in result.stdout or '\nERROR:' in result.stdout else 0)
          PYCODE
      - name: Simulation regression tests
        run: '"$GODOT_BIN" --headless --script tests/run.gd'
      - name: Career and multi-winter regression tests
        run: '"$GODOT_BIN" --headless --script tests/progression.gd'
      - name: Mountain, snow and map progression tests
        run: '"$GODOT_BIN" --headless --script tests/mountain_life.gd'
      - name: Automatic classification and junction routes
        run: |
          "$GODOT_BIN" --headless --script tests/piste_planning.gd
          "$GODOT_BIN" --headless --script tests/junctions.gd
      - name: Lift seats, pedestrian areas and migration tests
        run: '"$GODOT_BIN" --headless --script tests/lifts_and_plazas.gd'
      - name: Curve geometry, pedestrian safety and weekly balance
        run: '"$GODOT_BIN" --headless --script tests/build_comfort.gd'
      - name: Install virtual display for rendered tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Scene, touch and rendered animation tests
        run: xvfb-run -a -s '-screen 0 1440x900x24' "$GODOT_BIN" --audio-driver Dummy --resolution 1440x900 --script tests/scene.gd
      - name: Camera, terrain and editable waypoint tests
        run: xvfb-run -a -s '-screen 0 1440x900x24' "$GODOT_BIN" --audio-driver Dummy --resolution 1440x900 --script tests/planning_scene.gd
      - name: Rendered lift occupants and station plazas
        run: xvfb-run -a -s '-screen 0 1440x900x24' "$GODOT_BIN" --audio-driver Dummy --resolution 1440x900 --script tests/lift_scene.gd
      - name: Build cancellation, two-finger camera and pen/finger scrolling
        run: xvfb-run -a -s '-screen 0 1440x900x24' "$GODOT_BIN" --audio-driver Dummy --resolution 1440x900 --script tests/build_input_scene.gd
      - name: Independent region save slots
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/skizones-test-regions
        run: '"$GODOT_BIN" --headless --script tests/regions.gd'
      - name: Scene smoke test
        run: '"$GODOT_BIN" --headless -- --smoke-test'
      - name: Install Android SDK components
        run: |
          python3 - <<'PY'
          import os, subprocess
          manager = os.path.join(os.environ['ANDROID_HOME'], 'cmdline-tools/latest/bin/sdkmanager')
          subprocess.run([manager, '--licenses'], input=('y\n' * 100).encode(), check=True)
          subprocess.run([manager, 'platform-tools', 'platforms;android-35', 'build-tools;35.0.0'], check=True)
          PY
      - name: Keep debug signing identity between builds
        uses: actions/cache@v4
        with:
          path: build/export-config/skizones-debug.keystore
          key: skizones-ci-debug-keystore-v1
      - name: Export Android APK
        run: python3 tools/export_android.py
      - name: Verify APK signature and archive
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/android/SkiZones-debug.apk
          unzip -t build/android/SkiZones-debug.apk | tail -1
      - name: Prepare versioned APK download
        id: package
        run: python3 tools/package_android.py
      - uses: actions/upload-artifact@v4
        with:
          name: SkiZones-Android-debug
          path: build/release/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish APK download
    needs: godot
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SkiZones-Android-debug
          path: build/release
      - name: Publish an immutable preview release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.godot.outputs.version }}
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; its downloads are preserved."
          else
            gh release create "$tag" build/release/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "SkiZones ${VERSION} · Android Preview" \
              --notes-file "docs/releases/${VERSION}.md" \
              --prerelease --latest=false
          fi
