name: 0.40 Command Center Fast QA

on:
  pull_request:
    paths:
      - 'src/core/resort_pulse_040.gd'
      - 'src/core/frame_pacing_040.gd'
      - 'src/main.gd'
      - 'src/world/resort_view.gd'
      - 'src/ui/resort_command_center_040.gd'
      - 'src/ui/resort_operations_map_040.gd'
      - 'src/ui/building_browser.gd'
      - 'src/ui/management.gd'
      - 'tests/*040.gd'
      - 'translations/en.po'
      - '.github/workflows/040-fast-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skizones-040-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  command-center:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      SKIZONES_TOOLS_DIR: /home/runner/skizones-godot
      XDG_DATA_HOME: /home/runner/skizones-godot/share
      GODOT_BIN: /home/runner/skizones-godot/Godot_v4.5.2-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: godot-cache
        with:
          path: /home/runner/skizones-godot
          key: godot-4.5.2-linux-android-source-v2
      - name: Install pinned Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: bash tools/install_godot.sh
      - name: Import and compile all game scripts
        run: |
          python3 - <<'PY'
          import os, subprocess, sys
          p = subprocess.run([os.environ["GODOT_BIN"], "--headless", "--editor", "--import", "--quit"], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, timeout=180)
          print(p.stdout)
          sys.exit(1 if p.returncode or "SCRIPT ERROR" in p.stdout or "\nERROR:" in p.stdout else 0)
          PY
      - name: Check complete DE/EN translations
        run: python3 tools/check_localization.py
      - name: Verify 1x/4x/8x smooth lift pacing and bounded catch-up
        run: python3 tools/run_godot_test.py --timeout 180 -- "$GODOT_BIN" --language de --headless --script tests/frame_pacing_040.gd
      - name: Profile 1x, 4x and 8x frame CPU cost across light and crowded ski resorts
        run: python3 tools/run_godot_test.py --timeout 240 -- "$GODOT_BIN" --language de --headless --script tools/performance_benchmark.gd
      - name: Verify actual simulation diagnostics and no save changes
        run: python3 tools/run_godot_test.py --timeout 180 -- "$GODOT_BIN" --language de --headless --script tests/resort_pulse_040.gd
      - name: Install software renderer for real phone screens
        run: |
          sudo apt-get update -qq -o Acquire::Retries=2 -o Acquire::http::Timeout=30
          sudo apt-get install -y -o Acquire::Retries=2 xvfb libgl1-mesa-dri
      - name: Run 0.40 actual mobile UI at 420x860
        run: xvfb-run -a -s '-screen 0 1200x1000x24' python3 tools/run_godot_test.py --timeout 240 -- "$GODOT_BIN" --language de --audio-driver Dummy --resolution 420x860 --script tests/resort_command_center_scene_040.gd
      - name: Run 0.40 in English at 1440x900
        run: xvfb-run -a -s '-screen 0 1600x1000x24' python3 tools/run_godot_test.py --timeout 240 -- "$GODOT_BIN" --language en --audio-driver Dummy --resolution 1440x900 --script tests/resort_command_center_scene_040.gd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SkiZones-040-UI-QA
          path: build/qa/040-*.png
          if-no-files-found: ignore
          retention-days: 30
