name: 0.38 Hotel, Staffing and Safe Save Manager QA
on:
  pull_request:
    paths:
      - 'src/core/hotel_simulator.gd'
      - 'src/core/hotel_rooms.gd'
      - 'src/core/save_management_038.gd'
      - 'src/core/save_store.gd'
      - 'src/ui/career_slots.gd'
      - 'src/ui/lift_staff.gd'
      - 'src/ui/management.gd'
      - 'src/ui/building_experience.gd'
      - 'src/core/progression.gd'
      - 'tests/save_management_038.gd'
      - 'tests/hotel_simulator_038.gd'
      - '.github/workflows/hotel-career-038.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ski038-hotel-saves-${{ github.ref }}
  cancel-in-progress: true
jobs:
  hotel-career:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SKIZONES_TOOLS_DIR: /home/runner/skizones-godot
      XDG_DATA_HOME: /home/runner/skizones-godot/share
      GODOT_BIN: /home/runner/skizones-godot/Godot_v4.5.2-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: godot-cache
        with:
          path: /home/runner/skizones-godot
          key: godot-4.5.2-linux-android-source-v2
      - name: Install pinned Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: bash tools/install_godot.sh
      - name: Validate imported scripts and DE-EN strings
        run: |
          "$GODOT_BIN" --headless --editor --import --quit
          python3 tools/check_localization.py
      - name: Hotel Simulator, Sanitation and Research
        run: python3 tools/run_godot_test.py --timeout 180 -- "$GODOT_BIN" --language de --headless --script tests/hotel_simulator_038.gd
      - name: Isolated historical-save copy, corruption and archive
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/skizones-test-save-manager-038
        run: python3 tools/run_godot_test.py --timeout 240 -- "$GODOT_BIN" --language de --headless --script tests/save_management_038.gd
