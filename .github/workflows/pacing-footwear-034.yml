name: 0.34 time, pedestrian snow and lift terrain-camera QA

on:
  pull_request:
    paths:
      - 'src/main.gd'
      - 'src/ui/hud.gd'
      - 'src/world/resort_view.gd'
      - 'src/world/foot_wear.gd'
      - 'tests/footwear_pacing_camera_034.gd'
      - '.github/workflows/pacing-footwear-034.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skizones-pacing-footwear-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pacing-footwear:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SKIZONES_TOOLS_DIR: /home/runner/skizones-godot
      XDG_DATA_HOME: /home/runner/skizones-godot/share
      GODOT_BIN: /home/runner/skizones-godot/Godot_v4.5.2-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: godot-cache
        with:
          path: /home/runner/skizones-godot
          key: godot-4.5.2-linux-android-source-v2
      - name: Install pinned Godot engine
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: bash tools/install_godot.sh
      - name: Import and verify GDScript source
        run: |
          python3 - <<'PY'
          import os, subprocess
          p = subprocess.run([os.environ["GODOT_BIN"], "--headless", "--editor", "--import", "--quit"], capture_output=True, text=True, timeout=180)
          print(p.stdout+p.stderr)
          raise SystemExit(1 if p.returncode or "SCRIPT ERROR" in p.stdout+p.stderr else 0)
          PY
          python3 tools/check_localization.py
      - name: Prior long-day and night regression
        run: python3 tools/run_godot_test.py --timeout 240 -- "$GODOT_BIN" --language de --headless --script tests/pacing_and_nights.gd
      - name: Install rendered GUI test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Test mobile 1x/4x/8x, lift camera and progressive snow wear
        run: xvfb-run -a -s '-screen 0 1440x900x24' python3 tools/run_godot_test.py --timeout 300 -- "$GODOT_BIN" --language de --audio-driver Dummy --resolution 1280x800 --script tests/footwear_pacing_camera_034.gd
      - name: Existing build-map input regression
        run: xvfb-run -a -s '-screen 0 1440x900x24' python3 tools/run_godot_test.py --timeout 300 -- "$GODOT_BIN" --language de --audio-driver Dummy --resolution 1280x800 --script tests/build_input_scene.gd
