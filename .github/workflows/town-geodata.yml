name: Town geodata and transit unit checks

on:
  push:
    branches:
      - feature/osm-town-transit-issue-10
    paths:
      - 'tools/import_town_geodata.py'
      - 'tools/build_town_network.py'
      - 'tests/test_town_geodata.py'
      - 'tests/test_town_network.py'
      - 'src/world/town_scenery.gd'
      - 'src/world/compact_village.gd'
      - 'src/world/resort_view.gd'
      - 'tests/town_scenery.gd'
      - 'tests/traffic_and_finances.gd'
      - 'tests/resort_worlds.gd'
      - 'src/core/guest_traffic.gd'
      - 'src/core/ski_motion.gd'
      - 'src/core/resort.gd'
      - 'tests/hotel_holidays.gd'
      - 'src/core/guest_needs.gd'
      - 'src/core/guest_lodging.gd'
      - 'src/core/operations.gd'
      - 'src/ui/operating_pages.gd'
      - 'src/main.gd'
      - 'src/boot.gd'
      - 'src/ui/hud.gd'
      - 'translations/en.po'
      - 'assets/geodata/towns/*.json'
      - '.github/workflows/town-geodata.yml'
  pull_request:
    paths:
      - 'tools/import_town_geodata.py'
      - 'tools/build_town_network.py'
      - 'tests/test_town_geodata.py'
      - 'tests/test_town_network.py'
      - 'src/world/town_scenery.gd'
      - 'src/world/compact_village.gd'
      - 'src/world/resort_view.gd'
      - 'tests/town_scenery.gd'
      - 'tests/traffic_and_finances.gd'
      - 'tests/resort_worlds.gd'
      - 'src/core/guest_traffic.gd'
      - 'src/core/ski_motion.gd'
      - 'src/core/resort.gd'
      - 'tests/hotel_holidays.gd'
      - 'src/core/guest_needs.gd'
      - 'src/core/guest_lodging.gd'
      - 'src/core/operations.gd'
      - 'src/ui/operating_pages.gd'
      - 'src/main.gd'
      - 'src/boot.gd'
      - 'src/ui/hud.gd'
      - 'translations/en.po'
      - 'assets/geodata/towns/*.json'
      - '.github/workflows/town-geodata.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned image dependency
        run: python -m pip install 'Pillow>=10,<13'
      - name: Check Python syntax
        run: python -m compileall -q tools/import_town_geodata.py tools/build_town_network.py tests/test_town_geodata.py tests/test_town_network.py
      - name: Verify complete bilingual source strings before long Android QA
        run: python tools/check_localization.py
      - name: Offline source and routing regression tests
        run: python -m unittest discover -s tests -p 'test_town_*.py' -v
      - name: Construct road and bus-capable graphs from pinned source
        run: |
          python tools/build_town_network.py
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.build_town_network import route
          for name in ('braunlage', 'filzmoos', 'kitzbuehel', 'seiseralm'):
              path = Path('assets/geodata/towns') / (name + '-network.json')
              data = json.loads(path.read_text())
              assert len(data['vertices']) > 50, (name, 'too few street vertices')
              assert any(edge['mode'] == 'bus' for edge in data['edges']), name
              assert data['region'] == name
              for stop in data['stops']:
                  if stop['connected']:
                      assert stop['access_node'] in data['vertices']
              sh = data.get('hotel_gondola_shuttle') or {}
              print(name, 'hotel_to_gondola=',bool(sh),
                    'hotel_osm_id=',sh.get('from_hotel',{}).get('osm_id'),
                    'lift_id=',sh.get('to_lift',{}).get('id'),
                    'road_metres=',sh.get('outbound_metres'))
              print(name, 'vertices=',len(data['vertices']),'edges=',len(data['edges']),
                    'stops=',len(data['stops']),'connected=',sum(s['connected'] for s in data['stops']))
          PY

  pin-graphs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/osm-town-transit-issue-10'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Build four deterministic street/transit graphs
        run: python3 tools/build_town_network.py
      - name: Commit pinned, reviewed-source graph outputs
        run: |
          git add assets/geodata/towns/*-network.json
          if git diff --cached --quiet; then
            echo 'Graph snapshots already match exact input.'
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'data(osm): pin generated street and transit graphs [skip ci]'
            git push origin HEAD:feature/osm-town-transit-issue-10
          fi

  render-town:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SKIZONES_TOOLS_DIR: /home/runner/skizones-godot
      XDG_DATA_HOME: /home/runner/skizones-godot/share
      GODOT_BIN: /home/runner/skizones-godot/Godot_v4.5.2-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: godot-cache
        with:
          path: /home/runner/skizones-godot
          key: godot-4.5.2-linux-android-source-v2
      - name: Install pinned Godot 4.5.2
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: bash tools/install_godot.sh
      - name: Import Godot project
        run: |
          "$GODOT_BIN" --headless --editor --import --quit
      - name: Parse isolated village and source overlay scripts
        run: |
          "$GODOT_BIN" --headless --check-only --script res://src/world/compact_village.gd
          "$GODOT_BIN" --headless --check-only --script res://src/world/town_scenery.gd
      - name: Verify sourced streets, POIs and 3D render geometry
        run: python3 tools/run_godot_test.py --timeout 360 -- "$GODOT_BIN" --headless --script tests/town_scenery.gd
      - name: Verify multi-day hotel reservations, sleeping guests and save continuity
        run: python3 tools/run_godot_test.py --timeout 300 -- "$GODOT_BIN" --headless --script tests/hotel_holidays.gd
      - name: Verify passing skiers and per-venue black/red operating results
        run: python3 tools/run_godot_test.py --timeout 180 -- "$GODOT_BIN" --headless --script tests/traffic_and_finances.gd
      - name: Verify free-lane passing under a crowded resort
        run: python3 tools/run_godot_test.py --timeout 180 -- "$GODOT_BIN" --headless --script tests/ski_traffic.gd
      - name: Verify cross-map scenery and saved active crowded descents
        run: python3 tools/run_godot_test.py --timeout 240 -- "$GODOT_BIN" --headless --script tests/resort_worlds.gd
