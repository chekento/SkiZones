name: Town geodata and transit unit checks

on:
  push:
    branches:
      - feature/osm-town-transit-issue-10
    paths:
      - 'tools/import_town_geodata.py'
      - 'tools/build_town_network.py'
      - 'tests/test_town_geodata.py'
      - 'tests/test_town_network.py'
      - '.github/workflows/town-geodata.yml'
  pull_request:
    paths:
      - 'tools/import_town_geodata.py'
      - 'tools/build_town_network.py'
      - 'tests/test_town_geodata.py'
      - 'tests/test_town_network.py'
      - '.github/workflows/town-geodata.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned image dependency
        run: python -m pip install 'Pillow>=10,<13'
      - name: Check Python syntax
        run: python -m compileall -q tools/import_town_geodata.py tools/build_town_network.py tests/test_town_geodata.py tests/test_town_network.py
      - name: Offline source and routing regression tests
        run: python -m unittest discover -s tests -p 'test_town_*.py' -v
