name: 0.42 250-person live resort traffic stress
on:
  pull_request:
    paths:
      - 'tests/crowd_stress_042.gd'
      - 'src/core/guest_traffic.gd'
      - 'src/core/resort.gd'
      - 'src/core/operations.gd'
      - '.github/workflows/crowd-stress-042.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crowd-stress-042-${{ github.ref }}
  cancel-in-progress: true
jobs:
  crowd:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SKIZONES_TOOLS_DIR: /home/runner/skizones-godot
      XDG_DATA_HOME: /home/runner/skizones-godot/share
      GODOT_BIN: /home/runner/skizones-godot/Godot_v4.5.2-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: godot-cache
        with:
          path: /home/runner/skizones-godot
          key: godot-4.5.2-linux-android-source-v2
      - name: Install pinned Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: bash tools/install_godot.sh
      - name: Import project
        run: '"$GODOT_BIN" --headless --editor --import --quit'
      - name: Existing 240-skier lane and overtaking regression
        run: python3 tools/run_godot_test.py --strict-engine-errors --timeout 180 -- "$GODOT_BIN" --headless --audio-driver Dummy --script tests/ski_traffic.gd
      - name: Real resort graph with 250 concurrent skiers at 1x 4x and 8x
        run: python3 tools/run_godot_test.py --strict-engine-errors --timeout 300 -- "$GODOT_BIN" --headless --audio-driver Dummy --script tests/crowd_stress_042.gd
