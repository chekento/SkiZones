name: 0.42.3 staff pathways, roles, academy and safe-night QA
on:
  pull_request:
    paths:
      - 'src/core/operations.gd'
      - 'src/core/resort.gd'
      - 'src/core/day_rhythm.gd'
      - 'src/main.gd'
      - 'src/world/crew_life.gd'
      - 'src/ui/staff_training_scene_0423.gd'
      - 'src/ui/staff_training_panel_042.gd'
      - 'src/ui/lift_staff.gd'
      - 'tests/patch_0423.gd'
      - '.github/workflows/patch-0423.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: patch-0423-${{ github.ref }}
  cancel-in-progress: true
jobs:
  operational-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      SKIZONES_TOOLS_DIR: /home/runner/skizones-godot
      XDG_DATA_HOME: /home/runner/skizones-godot/share
      GODOT_BIN: /home/runner/skizones-godot/Godot_v4.5.2-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: godot-cache
        with:
          path: /home/runner/skizones-godot
          key: godot-4.5.2-linux-android-source-v2
      - name: Install pinned Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: bash tools/install_godot.sh
      - name: Import project
        run: '"$GODOT_BIN" --headless --editor --import --quit'
      - name: 0.42.3 night, vocation, staff schedules and economic bottlenecks
        run: python3 tools/run_godot_test.py --strict-engine-errors --timeout 300 -- "$GODOT_BIN" --headless --audio-driver Dummy --script tests/patch_0423.gd
      - name: Existing rescue and silent-night safety
        run: |
          python3 tools/run_godot_test.py --strict-engine-errors --timeout 360 -- "$GODOT_BIN" --headless --audio-driver Dummy --script tests/patch_0422.gd
          python3 tools/run_godot_test.py --strict-engine-errors --timeout 360 -- "$GODOT_BIN" --headless --audio-driver Dummy --script tests/quiet_night_033.gd
      - name: Existing vocational progression and grade persistence
        run: python3 tools/run_godot_test.py --strict-engine-errors --timeout 240 -- "$GODOT_BIN" --headless --audio-driver Dummy --script tests/staff_training_042.gd
