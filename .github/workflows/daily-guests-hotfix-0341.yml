name: 0.34.1 Hotfix – daily arrivals and staggered hotel mornings
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-arrivals-hotfix-0341-${{ github.ref }}
  cancel-in-progress: true
jobs:
  guests-and-hotels:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SKIZONES_TOOLS_DIR: /home/runner/skizones-godot
      XDG_DATA_HOME: /home/runner/skizones-godot/share
      GODOT_BIN: /home/runner/skizones-godot/Godot_v4.5.2-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: godot-cache
        with:
          path: /home/runner/skizones-godot
          key: godot-4.5.2-linux-android-source-v2
      - name: Install pinned Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: bash tools/install_godot.sh
      - name: Compile GDScript and import game resources
        run: |
          python3 - <<'PY'
          import os,subprocess
          p=subprocess.run([os.environ["GODOT_BIN"],"--headless","--editor","--import","--quit"],capture_output=True,text=True,timeout=180)
          print(p.stdout+p.stderr)
          raise SystemExit(1 if p.returncode or "SCRIPT ERROR" in p.stdout+p.stderr else 0)
          PY
      - name: Verify genuine day 2/3 visitors, thaw, hotel 07–09 and backups
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/skizones-arrivals-0341
        run: python3 tools/run_godot_test.py --timeout 240 -- "$GODOT_BIN" --language de --headless --script tests/daily_guests_hotfix_0341.gd
      - name: Original real hotel holidays preserve active rooms and savings
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/skizones-hotel-0341
        run: python3 tools/run_godot_test.py --timeout 240 -- "$GODOT_BIN" --language de --headless --script tests/hotel_holidays.gd
      - name: Hotel family remains together with staggered departures
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/skizones-family-0341
        run: python3 tools/run_godot_test.py --timeout 320 -- "$GODOT_BIN" --language de --headless --script tests/family_holidays.gd
      - name: Original daily cycle and honest ticket sales
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/skizones-day-0341
        run: python3 tools/run_godot_test.py --timeout 300 -- "$GODOT_BIN" --language de --headless --script tests/day_cycle.gd
      - name: Night/day visitor accounting, weather and ticket QA
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/skizones-night-0341
        run: |
          python3 tools/run_godot_test.py --timeout 300 -- "$GODOT_BIN" --language de --headless --script tests/quiet_night_033.gd
          python3 tools/run_godot_test.py --timeout 240 -- "$GODOT_BIN" --language de --headless --script tests/weather_distribution_033.gd
      - name: 0.33.2/0.34 career recovery and free slots
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/skizones-test-save-0341
        run: python3 tools/run_godot_test.py --timeout 320 -- "$GODOT_BIN" --language de --headless --script tests/save_rescue_free_slots_0332.gd
