name: 0.42 themed architectural identity QA
on:
  pull_request:
    paths:
      - 'src/world/facade_identity_042.gd'
      - 'src/world/style_assets.gd'
      - 'tests/facade_identity_042.gd'
      - '.github/workflows/facade-identity-042.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: architecture-042-${{ github.ref }}
  cancel-in-progress: true
jobs:
  architectural-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      SKIZONES_TOOLS_DIR: /home/runner/skizones-godot
      XDG_DATA_HOME: /home/runner/skizones-godot/share
      GODOT_BIN: /home/runner/skizones-godot/Godot_v4.5.2-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: godot-cache
        with:
          path: /home/runner/skizones-godot
          key: godot-4.5.2-linux-android-source-v2
      - name: Install pinned Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: bash tools/install_godot.sh
      - name: Import source
        run: '"$GODOT_BIN" --headless --editor --import --quit'
      - name: Ten theme identities, visible building type details and safe saves
        run: python3 tools/run_godot_test.py --strict-engine-errors --timeout 240 -- "$GODOT_BIN" --language de --headless --audio-driver Dummy --script tests/facade_identity_042.gd
      - name: Existing ten-theme asset matrix and seasonal dressing
        run: python3 tools/run_godot_test.py --strict-engine-errors --timeout 300 -- "$GODOT_BIN" --language de --headless --audio-driver Dummy --script tests/style_asset_festival_032.gd
