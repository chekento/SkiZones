name: Refresh APK presentation

on:
  workflow_dispatch:
  release:
    types: [published]
  workflow_run:
    workflows: ['Validate and build Android']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-release-presentation.yml'
      - 'tools/sync_releases.py'
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: write

concurrency:
  group: release-presentation
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh APK links and counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/sync_releases.py --ski
      - name: Save presentation updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CHANGELOG.md docs/downloads.json docs/images/apk-downloads.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: refresh APK links and download totals [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
