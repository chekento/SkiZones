name: Import verified CC0 Alpine Radio music
on:
  push:
    branches:
      - feature/027-cc0-radio-library
      - feature/027-cc0-radio-72
      - feature/034-radio-genre-offline-cc0
    paths:
      - assets/music/cc0/library.json
      - tools/import_cc0_radio.py
      - .github/workflows/import-cc0-radio.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and hash-verify original CC0 audio
        run: python3 tools/import_cc0_radio.py
      - uses: actions/cache@v4
        id: godot-cache
        with:
          path: /home/runner/skizones-godot
          key: godot-4.5.2-linux-android-source-v2
      - name: Install pinned Godot for accurate Ogg timing
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: bash tools/install_godot.sh
      - name: Import tracks and measure exact, broadcast-safe durations
        env:
          GODOT_BIN: /home/runner/skizones-godot/Godot_v4.5.2-stable_linux.x86_64
          SKIZONES_TOOLS_DIR: /home/runner/skizones-godot
          XDG_DATA_HOME: /home/runner/skizones-godot/share
        run: |
          "$GODOT_BIN" --headless --editor --import --quit
          "$GODOT_BIN" --headless --script tools/measure_radio_durations.gd
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('assets/music/cc0/durations.json').read_text())
          library = json.loads(Path('assets/music/cc0/library.json').read_text())
          paths = {song['file'] for songs in library['stations'].values() for song in songs}
          assert paths == set(data['seconds']), f'Missing/extra durations: {paths ^ set(data["seconds"])}'
          assert all(v > 0 for v in data['seconds'].values())
          print('Verified', len(paths), 'exactly timed CC0 recordings')
          PY
      - name: Commit vendored music and source index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/music/cc0/*.ogg assets/music/cc0/durations.json
          if ! git diff --cached --quiet; then
            git commit -m "assets(audio): vendor provenance-verified offline CC0 OGG tracks"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
