name: 0.42 piste history, touch editing and safe undo
on:
  pull_request:
    paths:
      - 'src/main.gd'
      - 'src/core/plan_history_042.gd'
      - 'src/ui/hud.gd'
      - 'tests/plan_history_042.gd'
      - 'tests/piste_editor_scene.gd'
      - 'translations/en.po'
      - '.github/workflows/piste-editor-history-042.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: piste-history-042-${{ github.ref }}
  cancel-in-progress: true
jobs:
  route-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      SKIZONES_TOOLS_DIR: /home/runner/skizones-godot
      XDG_DATA_HOME: /home/runner/skizones-godot/share
      GODOT_BIN: /home/runner/skizones-godot/Godot_v4.5.2-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: godot-cache
        with:
          path: /home/runner/skizones-godot
          key: godot-4.5.2-linux-android-source-v2
      - name: Install pinned Godot engine
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: bash tools/install_godot.sh
      - name: Import source
        run: '"$GODOT_BIN" --headless --editor --import --quit'
      - name: Verify German and English controls
        run: python3 tools/check_localization.py
      - name: Route mutations, real scene, touch undo and save isolation
        run: python3 tools/run_godot_test.py --strict-engine-errors --timeout 240 -- "$GODOT_BIN" --language de --headless --audio-driver Dummy --script tests/plan_history_042.gd
      - name: Existing piste planning and connection regressions
        run: |
          python3 tools/run_godot_test.py --timeout 180 -- "$GODOT_BIN" --language de --headless --script tests/piste_planning.gd
          python3 tools/run_godot_test.py --timeout 180 -- "$GODOT_BIN" --language de --headless --script tests/piste_connections.gd
