name: 0.42 skier surface contact and climbing QA
on:
  pull_request:
    paths:
      - 'src/world/skier_pose_042.gd'
      - 'src/world/resort_view.gd'
      - 'src/core/ski_motion.gd'
      - 'src/core/piste_features.gd'
      - 'src/world/snow_render.gd'
      - 'tests/skier_surface_pose_042.gd'
      - '.github/workflows/skier-surface-042.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: skier-surface-042-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-skier-contact:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SKIZONES_TOOLS_DIR: /home/runner/skizones-godot
      XDG_DATA_HOME: /home/runner/skizones-godot/share
      GODOT_BIN: /home/runner/skizones-godot/Godot_v4.5.2-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: godot-cache
        with:
          path: /home/runner/skizones-godot
          key: godot-4.5.2-linux-android-source-v2
      - name: Install pinned Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: bash tools/install_godot.sh
      - name: Import all resources
        run: '"$GODOT_BIN" --headless --editor --import --quit'
      - name: Actual climbing, snow relief, rotated modules and split-leg contact
        run: python3 tools/run_godot_test.py --strict-engine-errors --timeout 180 -- "$GODOT_BIN" --language de --headless --audio-driver Dummy --script tests/skier_surface_pose_042.gd
      - name: Existing sport identities, deterministic saves, real module use and crowd rules
        run: |
          python3 tools/run_godot_test.py --strict-engine-errors --timeout 180 -- "$GODOT_BIN" --language de --headless --audio-driver Dummy --script tests/winter_sports.gd
          python3 tools/run_godot_test.py --strict-engine-errors --timeout 240 -- "$GODOT_BIN" --language de --headless --audio-driver Dummy --script tests/snowpark_modules_042.gd
          python3 tools/run_godot_test.py --strict-engine-errors --timeout 180 -- "$GODOT_BIN" --language de --headless --audio-driver Dummy --script tests/ski_traffic.gd
      - name: Scene graph still builds and actual carrier reentry remains valid
        run: python3 tools/run_godot_test.py --strict-engine-errors --timeout 240 -- "$GODOT_BIN" --language de --headless --audio-driver Dummy --script tests/lift_reentry_042.gd
