name: Original wordmark and operating header
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wordmark-header-${{ github.ref }}
  cancel-in-progress: true
jobs:
  wordmark-header:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SKIZONES_TOOLS_DIR: /home/runner/skizones-godot
      XDG_DATA_HOME: /home/runner/skizones-godot/share
      GODOT_BIN: /home/runner/skizones-godot/Godot_v4.5.2-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: godot-cache
        with:
          path: /home/runner/skizones-godot
          key: godot-4.5.2-linux-android-source-v2
      - name: Install pinned engine
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: bash tools/install_godot.sh
      - name: Import project
        run: '"$GODOT_BIN" --headless --editor --import --quit'
      - name: Verify bilingual strings
        run: python3 tools/check_localization.py
      - name: Virtual display
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Original wordmark, operating details and phone layout
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/wordmark-header-tests
        run: xvfb-run -a -s '-screen 0 1536x1000x24' python3 tools/run_godot_test.py --timeout 300 -- "$GODOT_BIN" --language de --audio-driver Dummy --resolution 1440x900 --script tests/wordmark_header_scene_032.gd
      - name: Existing presentation integration regression
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/cinematic-integration-tests
        run: xvfb-run -a -s '-screen 0 1536x1000x24' python3 tools/run_godot_test.py --timeout 300 -- "$GODOT_BIN" --language de --audio-driver Dummy --resolution 1440x900 --script tests/integration_quality_026.gd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wordmark-header-032-visual-QA
          path: build/qa/*
          retention-days: 30
