name: 0.43 wide-view forest rendering QA
on:
  pull_request:
    paths:
      - 'src/world/forest_lod.gd'
      - 'src/world/resort_view.gd'
      - 'tests/forest_overview_043.gd'
      - '.github/workflows/forest-overview-043.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forest-overview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SKIZONES_TOOLS_DIR: /home/runner/skizones-godot
      XDG_DATA_HOME: /home/runner/skizones-godot/share
      GODOT_BIN: /home/runner/skizones-godot/Godot_v4.5.2-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: godot-cache
        with:
          path: /home/runner/skizones-godot
          key: godot-4.5.2-linux-android-source-v2
      - name: Install pinned Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: bash tools/install_godot.sh
      - name: Import and parse
        run: '"$GODOT_BIN" --headless --editor --import --quit'
      - name: Wide-view budget, zoom recovery and culling
        run: python3 tools/run_godot_test.py --strict-engine-errors --timeout 240 -- "$GODOT_BIN" --headless --audio-driver Dummy --script tests/forest_overview_043.gd
